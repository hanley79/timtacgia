<title>Tìm bài hát theo tác giả</title>
<style>
body{font-family:Arial;background:#f3f6fb;margin:0}
header{background:#1d3557;color:#fff;padding:18px;text-align:center;font-size:30px;font-weight:bold;position:sticky;top:0}
#search{width:min(700px,90%);display:block;margin:18px auto;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc}
#toolbar{max-width:900px;margin:0 auto 8px;padding:0 20px;text-align:right}
#toolbar button{background:#334155}
#count{max-width:900px;margin:0 auto 8px;padding:0 20px;color:#555;font-size:14px;text-align:center}
#list{max-width:900px;margin:auto;padding:0 20px 20px}
.card{display:flex;justify-content:space-between;align-items:center;background:#fff;margin:8px 0;padding:12px 16px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.card .info{flex:1;min-width:0;margin-right:12px}
.card .info span{word-break:break-word}
.card .actions{display:flex;gap:6px;flex-shrink:0}
button{background:#2563eb;color:#fff;border:0;padding:8px 16px;border-radius:6px;cursor:pointer}
.btn-edit{background:#64748b}
.btn-save{background:#16a34a}
.btn-cancel{background:#94a3b8}
.edit-input{width:100%;padding:6px 8px;font-size:15px;border:1px solid #2563eb;border-radius:6px}
#viewer{display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.75)}
#frame{width:90%;height:90%;margin:2% auto;display:block;background:#fff}
.close{position:absolute;right:20px;top:10px;color:#fff;font-size:34px;cursor:pointer}
#empty{max-width:900px;margin:20px auto;padding:0 20px;color:#888;text-align:center;display:none}
</style></head><body>

// Đọc các chỉnh sửa tên bài hát đã lưu trước đó trên trình duyệt này (nếu có)
// và áp dụng lên dữ liệu gốc, dựa theo link (làm khoá duy nhất cho mỗi bài hát).
const STORAGE_KEY = 'song_edits_v1';
function loadEdits() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch (e) {
    return {};
  }
}
function saveEdits(edits) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(edits));
}

const edits = loadEdits();
allSongs.forEach(s => {
  if (edits[s.link] !== undefined) s.ten = edits[s.link];
});

let currentFiltered = allSongs;
let editingLink = null;

function render(songs) {
  currentFiltered = songs;
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const countEl = document.getElementById('count');

  if (songs.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    countEl.textContent = '';
    return;
  }
  empty.style.display = 'none';

  const authorCount = new Set(songs.map(s => s.tacgia)).size;
  countEl.textContent = `${songs.length} bài hát · ${authorCount} tác giả`;

  list.innerHTML = songs.map(s => {
    if (s.link === editingLink) {
      return `
        <div class="card">
          <div class="info">
            <input class="edit-input" id="edit-input" value="${escapeAttr(s.ten)}">
          </div>
          <div class="actions">
            <button class="btn-save" onclick="saveEdit('${s.link}')">Lưu</button>
            <button class="btn-cancel" onclick="cancelEdit()">Hủy</button>
          </div>
        </div>`;
    }
    return `
      <div class="card">
        <div class="info"><span>${escapeHtml(s.ten)} — ${escapeHtml(s.tacgia)}</span></div>
        <div class="actions">
          <button class="btn-edit" onclick="startEdit('${s.link}')">Sửa</button>
          <button onclick="openSong('${s.link}')">Xem</button>
        </div>
      </div>`;
  }).join('');

  if (editingLink !== null) {
    const input = document.getElementById('edit-input');
    if (input) { input.focus(); input.select(); }
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}
function escapeAttr(str) {
  return String(str).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function startEdit(link) {
  editingLink = link;
  render(currentFiltered);
}

function cancelEdit() {
  editingLink = null;
  render(currentFiltered);
}

function saveEdit(link) {
  const input = document.getElementById('edit-input');
  const newName = input.value.trim();
  if (newName === '') { cancelEdit(); return; }

  const song = allSongs.find(s => s.link === link);
  if (song) song.ten = newName;

  const currentEdits = loadEdits();
  currentEdits[link] = newName;
  saveEdits(currentEdits);

  editingLink = null;
  applyFilter();
}

function exportJson() {
  const dataToExport = allSongs.map(({ ten, tacgia, link }) => ({ ten, tacgia, link }));
  const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'songs.json';
  a.click();
  URL.revokeObjectURL(url);
}

function openSong(u) {
  document.getElementById('frame').src = u.replace('/view?', '/preview?');
  document.getElementById('viewer').style.display = 'block';
}

function closeViewer() {
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('frame').src = '';
}

function applyFilter() {
  const k = document.getElementById('search').value.toLowerCase().trim();
  const filtered = k === ''
    ? allSongs
    : allSongs.filter(s =>
        s.ten.toLowerCase().includes(k) || s.tacgia.toLowerCase().includes(k)
      );
  render(filtered);
}

document.getElementById('search').oninput = applyFilter;

render(allSongs);
</script>
